<section id="tab-home-visit" class="tab-content">
            <div class="glass-panel rounded-none sm:rounded-2xl p-6 md:p-8">
                <h3 class="text-2xl font-bold text-green-800 mb-6 border-b pb-3"><i class="fas fa-house-user mr-2"></i>ระบบเยี่ยมบ้านนักเรียน</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 mb-6 bg-white/40 border border-white/50 backdrop-blur-md p-4 rounded-xl shadow-sm w-full relative z-20">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ปีการศึกษา</label>
                        <select id="hv-year" class="w-full px-3 py-2 border rounded focus:ring-green-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ภาคเรียน</label>
                        <select id="hv-semester" class="w-full px-3 py-2 border rounded focus:ring-green-500">
                            <option value="1">1</option><option value="2">2</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชั้นเรียน (ที่ปรึกษา)</label>
                        <select id="hv-class" class="w-full px-3 py-2 border rounded focus:ring-green-500">
                            <option value="">-- เลือกชั้นเรียน --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">สถานะการเยี่ยมบ้าน</label>
                        <select id="hv-status" class="w-full px-3 py-2 border rounded focus:ring-green-500">
                            <option value="all">ทั้งหมด</option>
                            <option value="ยังไม่เยี่ยม">ยังไม่เยี่ยม</option>
                            <option value="สำเร็จ">เยี่ยมแล้ว (สำเร็จ)</option>
                            <option value="เลื่อนวันเข้าเยี่ยม">เลื่อนวันเข้าเยี่ยม</option>
                            <option value="ไม่พบนักเรียน">ไม่พบนักเรียน</option>
                            <option value="ไม่พบผู้ปกครอง">ไม่พบผู้ปกครอง</option>
                            <option value="บ้านอยู่ห่างไกล">บ้านอยู่ห่างไกล</option>
                            <option value="ผู้ปกครองไม่สะดวก">ผู้ปกครองไม่สะดวก</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="searchHomeVisit()" class="w-full bg-gradient-to-br from-blue-400/40 to-blue-600/30 text-blue-900 px-6 py-2 rounded-xl font-bold focus:outline-none btn-glass-raised"><i class="fas fa-search mr-2"></i> ค้นหา</button>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-end items-start sm:items-center mb-4 gap-3 w-full">
                    <button id="hv-btn-bulk-print" onclick="printSelectedHomeVisits()" class="hidden w-full sm:w-auto bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-xl font-bold btn-glass-raised"><i class="fas fa-print mr-2"></i> พิมพ์รายงานที่เลือก</button>
                </div>

                <div class="overflow-x-auto bg-white/40 border border-white/50 backdrop-blur-md rounded-xl shadow-sm w-full">
                    <table class="min-w-full divide-y divide-gray-200 mobile-card-table">
                        <thead class="bg-white/50">
                            <tr>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 whitespace-nowrap w-12"><input type="checkbox" id="hv-select-all" onchange="toggleAllHomeVisitCheckboxes(this)"></th>
                                <th class="hidden md:table-cell px-4 py-3 text-left text-xs font-medium text-gray-500 whitespace-nowrap">เลขที่</th>
                                <th class="hidden md:table-cell px-4 py-3 text-left text-xs font-medium text-gray-500 whitespace-nowrap">รหัสนักเรียน</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 whitespace-nowrap">ชื่อ - นามสกุล</th>
                                <th class="hidden lg:table-cell px-4 py-3 text-left text-xs font-medium text-gray-500 whitespace-nowrap">ข้อมูลผู้ปกครอง (บิดา/มารดา/ผู้ปกครองหลัก)</th>
                                <th class="hidden md:table-cell px-4 py-3 text-left text-xs font-medium text-gray-500 whitespace-nowrap">เบอร์โทรศัพท์ติดต่อ</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 whitespace-nowrap">ข้อมูลที่พักนักเรียน</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 whitespace-nowrap">สถานะการเยี่ยมบ้าน</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 whitespace-nowrap">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-home-visit" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </section>
