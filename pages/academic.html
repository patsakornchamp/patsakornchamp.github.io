<section id="tab-academic" class="tab-content">
            <div class="glass-panel rounded-none sm:rounded-2xl p-6 md:p-8">
                <h3 class="text-2xl font-bold text-green-800 mb-6 border-b pb-3"><i class="fas fa-graduation-cap mr-2"></i>พอร์ทัลผลการเรียนและสถิติเวลาเรียน</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6 bg-gray-50 p-4 rounded-lg">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ปีการศึกษา</label>
                        <select id="aca-year" class="w-full px-3 py-2 border rounded focus:ring-green-500" onchange="renderStudentAcademicPortal()"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ภาคเรียน</label>
                        <select id="aca-semester" class="w-full px-3 py-2 border rounded focus:ring-green-500" onchange="renderStudentAcademicPortal()"><option value="1">1</option><option value="2">2</option></select>
                    </div>
                    <div class="flex items-end">
                        <span class="text-sm text-gray-500 italic">แสดงผลเฉพาะวิชาที่เปิดบันทึก</span>
                    </div>
                </div>

                <!-- Course Summary Table -->
                <div class="overflow-x-auto md:bg-white md:rounded-lg md:border mb-8 w-full">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 hidden md:table-header-group">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">วิชา / ชุมนุม</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-green-600">มาเรียน (ครั้ง)</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-yellow-600">สาย</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-blue-600">ลา</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-red-600">ขาด</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500">% เวลาเรียน</th>
                            </tr>
                        </thead>
                        <tbody id="aca-table-body" class="divide-y divide-gray-200">
                            <!-- Loaded Dynamically -->
                        </tbody>
                    </table>
                </div>

            </div>
        </section>
