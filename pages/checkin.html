<section id="tab-checkin" class="tab-content active">
            <div class="glass-panel rounded-none sm:rounded-2xl p-4 sm:p-6 md:p-8">
                <h3 class="text-xl sm:text-2xl font-bold text-green-800 mb-4 border-b pb-3"><i class="fas fa-edit mr-2"></i>บันทึกการเข้าเรียนปกติ</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-7 gap-4 mb-6 bg-white/40 border border-white/50 backdrop-blur-md p-4 rounded-xl shadow-sm relative z-20">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">ปีการศึกษา</label>
                        <select id="checkin-year" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-green-500 shadow-sm" onchange="onCheckinYearSemesterChange(); resetCheckinTable();"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">ภาคเรียน</label>
                        <select id="checkin-semester" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-green-500 shadow-sm" onchange="onCheckinYearSemesterChange(); resetCheckinTable();">
                            <option value="1">1</option><option value="2">2</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-1">
                            วันที่
                            <span class="tooltip-container text-gray-400 hover:text-green-600">
                                <i class="fas fa-info-circle text-xs"></i>
                                <span class="tooltip-text">เลือกวันที่ที่ประสงค์ทำการเช็คชื่อ หรือบันทึกสถานะการเรียนปกติย้อนหลัง</span>
                            </span>
                        </label>
                        <input type="date" id="checkin-date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-green-500 shadow-sm" required onchange="resetCheckinTable()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-1">
                            คาบเรียน
                            <span class="tooltip-container text-gray-400 hover:text-green-600">
                                <i class="fas fa-info-circle text-xs"></i>
                                <span class="tooltip-text">เลือกคาบเรียนที่สอน ระบบจะคาดเดาคาบเรียนปัจจุบันให้เบื้องต้น</span>
                            </span>
                        </label>
                        <select id="checkin-period" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-green-500 shadow-sm" onchange="resetCheckinTable()">
                            <option value="">-- กำลังโหลดคาบเรียน --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-1">
                            ชั้นเรียน
                            <span class="tooltip-container text-gray-400 hover:text-green-600">
                                <i class="fas fa-info-circle text-xs"></i>
                                <span class="tooltip-text">เลือกห้องเรียนที่ต้องการบันทึกการเช็คชื่อตามปีการศึกษาและภาคเรียนที่กำหนด</span>
                            </span>
                        </label>
                        <select id="checkin-class" class="w-full border border-gray-300 rounded-md focus:ring-green-500 shadow-sm" onchange="onCheckinClassChange()"><option value="">-- เลือกชั้นเรียน --</option></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-1">
                            ครูผู้สอน
                            <span class="tooltip-container text-gray-400 hover:text-green-600">
                                <i class="fas fa-info-circle text-xs"></i>
                                <span class="tooltip-text">เลือกชื่อครูผู้สอน หากคุณเป็นครูผู้สอนระบบจะเลือกชื่อคุณให้อัตโนมัติ</span>
                            </span>
                        </label>
                        <select id="checkin-teacher" class="w-full border border-gray-300 rounded-md focus:ring-green-500 shadow-sm" onchange="onTeacherChange()"><option value="">-- เลือกครูผู้สอน --</option></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-1">
                            วิชา
                            <span class="tooltip-container text-gray-400 hover:text-green-600">
                                <i class="fas fa-info-circle text-xs"></i>
                                <span class="tooltip-text">เลือกวิชาที่สอน โดยตัวเลือกจะแปรผันตามวิชาที่ครูผู้สอนคนนั้นๆ ได้รับมอบหมาย</span>
                            </span>
                        </label>
                        <select id="checkin-subject" class="w-full border border-gray-300 rounded-md focus:ring-green-500 shadow-sm" onchange="resetCheckinTable()"><option value="">-- เลือกวิชา --</option></select>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 w-full">
                    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                        <button id="load-students-btn" onclick="loadCheckinList()" class="w-full sm:w-auto bg-gradient-to-br from-blue-400/40 to-blue-600/30 text-blue-900 px-6 py-2 rounded-xl font-bold focus:outline-none btn-glass-raised"><i class="fas fa-search mr-2"></i> โหลดรายชื่อ</button>
                        <button id="pull-qr-btn" onclick="pullStudentCheckIns()" class="hidden w-full sm:w-auto bg-gradient-to-r from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 text-white shadow-md px-4 py-2 rounded-xl font-bold focus:outline-none transition-all" title="ดึงข้อมูลเช็คชื่อจากการสแกน QR ของนักเรียน"><i class="fas fa-cloud-download-alt mr-1"></i> ดึงสแกน</button>
                        <button id="tc-scan-btn" onclick="openTeacherQrScanner()" class="hidden w-full sm:w-auto bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white shadow-md px-4 py-2 rounded-xl font-bold focus:outline-none transition-all" title="เปิดกล้องครูเพื่อสแกน QR นักเรียน"><i class="fas fa-camera mr-1"></i> สแกนเด็ก</button>
                        <button id="tc-show-qr-btn" onclick="showClassroomQrModal()" class="hidden w-full sm:w-auto bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white shadow-md px-4 py-2 rounded-xl font-bold focus:outline-none transition-all" title="แสดง QR ขึ้นจอเพื่อให้นักเรียนสแกนเช็คชื่อ"><i class="fas fa-qrcode mr-1"></i> โชว์ QR</button>
                    </div>
                    <div id="bulk-actions" class="hidden items-center w-full sm:w-auto justify-between sm:justify-end flex-wrap gap-2">
                        <span class="text-sm font-medium text-gray-600 whitespace-nowrap">เช็คทั้งหมด:</span>
                        <div class="flex gap-1 sm:gap-2">
                            <button onclick="setAllAttendance('มา')" class="text-sm bg-gradient-to-br from-green-400/40 to-green-600/30 text-green-900 px-4 py-2 rounded-full font-bold btn-glass-raised">มา</button>
                            <button onclick="setAllAttendance('สาย')" class="text-sm bg-gradient-to-br from-yellow-400/40 to-yellow-600/30 text-yellow-900 px-4 py-2 rounded-full font-bold btn-glass-raised">สาย</button>
                            <button onclick="setAllAttendance('ลา')" class="text-sm bg-gradient-to-br from-blue-400/40 to-blue-600/30 text-blue-900 px-4 py-2 rounded-full font-bold btn-glass-raised">ลา</button>
                            <button onclick="setAllAttendance('ขาด')" class="text-sm bg-gradient-to-br from-red-400/40 to-red-600/30 text-red-900 px-4 py-2 rounded-full font-bold btn-glass-raised">ขาด</button>
                        </div>
                    </div>
                </div>

                <div id="checkin-alert" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4 text-yellow-700 text-sm"><p><i class="fas fa-exclamation-triangle mr-2"></i>กรุณาเลือกเงื่อนไขการเช็คชื่อปกติให้ครบถ้วนเพื่อโหลดรายชื่อ</p></div>
                <div id="no-students-alert" class="hidden bg-blue-50 border-l-4 border-blue-400 p-4 mb-4 text-blue-700 text-sm"><p><i class="fas fa-info-circle mr-2"></i>ไม่พบรายชื่อนักเรียนปกติในชั้นเรียนนี้</p></div>

            <div class="w-full bg-white/40 backdrop-blur-md rounded-xl border border-white/50 shadow-sm hidden" id="student-list-container">
                    <div class="p-3 sm:p-4 bg-green-50/50 border-b border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="relative w-full md:w-80">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><i class="fas fa-search"></i></span>
                            <input type="text" id="checkin-search" onkeyup="renderCheckinTable()" placeholder="ค้นหา เลขที่, รหัส หรือชื่อ..." class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-green-500 focus:border-green-500 text-sm">
                        </div>
                        <div class="flex items-center w-full md:w-auto">
                            <label class="inline-flex items-center text-sm font-medium text-gray-700 cursor-pointer select-none">
                                <input type="checkbox" id="checkin-hide-checked" onchange="renderCheckinTable()" class="rounded border-gray-300 text-green-600 focus:ring-green-500 mr-2 w-5 h-5"> แสดงเฉพาะคนที่ยังไม่เช็คชื่อ
                            </label>
                        </div>
                    </div>
                    
                    <!-- Table with Mobile Responsive Classes -->
                    <table class="min-w-full divide-y divide-gray-200 mobile-card-table">
                        <thead class="bg-white/50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden md:table-cell">เลขที่</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden md:table-cell">รหัสประจำตัว</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ชื่อ - นามสกุล</th>
                                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider md:w-72">สถานะ</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="checkin-table-body"></tbody>
                    </table>
                </div>

                <div class="mt-8 flex flex-col sm:flex-row justify-end gap-3 hidden" id="save-btn-container">
                    <button onclick="exportCheckinCSV()" class="w-full sm:w-auto bg-gradient-to-br from-blue-500/40 to-blue-700/30 text-blue-900 px-6 py-3 rounded-xl font-bold text-lg btn-glass-raised"><i class="fas fa-file-csv mr-2"></i> ส่งออก CSV</button>
                    <button id="save-attendance-btn" onclick="saveAttendance()" class="w-full sm:w-auto bg-gradient-to-br from-green-500/40 to-green-700/30 text-green-900 px-8 py-3 rounded-xl font-bold text-lg btn-glass-raised"><i class="fas fa-save mr-2"></i> บันทึกข้อมูล</button>
                </div>
            </div>
        </section>
